name: Build frontend static bundle

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.0

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@12.14.0 --activate

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm --filter @jellyfin-vue/frontend build

      - name: Locate dist
        run: |
          find packages/frontend -maxdepth 2 -type d -name dist | head -5
          du -sh packages/frontend/dist 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jellyfin-vue-frontend
          path: packages/frontend/dist
          retention-days: 30

      - name: Release (tagged builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: jellyfin-vue-frontend.zip
